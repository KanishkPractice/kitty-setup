# ~/.config/starship.toml
# Tokyo Night Segmented Prompt with Modern Nerd Font Glyphs

format = """
[](#7aa2f7)$os$username[](bg:#3b4261 fg:#7aa2f7)$directory[](bg:#7dcfff fg:#3b4261)$git_branch$git_status[](bg:#24283b fg:#7dcfff)$c$rust$golang$nodejs$python[](fg:#24283b)$cmd_duration$time
$character"""

palette = "tokyo_night"

[palettes.tokyo_night]
bg = "#1a1b26"
bg_dark = "#16161e"
bg_highlight = "#292e42"
terminal_black = "#414868"
fg = "#c0caf5"
fg_dark = "#a9b1d6"
fg_gutter = "#3b4261"
dark3 = "#545c7e"
comment = "#565f89"
dark5 = "#737aa2"
blue0 = "#3d59a1"
blue = "#7aa2f7"
cyan = "#7dcfff"
blue1 = "#2ac3de"
blue2 = "#0db9d7"
blue5 = "#89ddff"
blue6 = "#b4f9f8"
blue7 = "#394b70"
magenta = "#bb9af7"
magenta2 = "#ff007c"
purple = "#9d7cd8"
orange = "#ff9e64"
yellow = "#e0af68"
green = "#9ece6a"
green1 = "#73daca"
green2 = "#41a6b5"
teal = "#1abc9c"
red = "#f7768e"
red1 = "#db4b4b"

[os]
disabled = false
style = "bg:#7aa2f7 fg:#1a1b26 bold"
symbols = { Fedora = "  ", Linux = "  " }
format = "[$symbol]($style)"

[username]
show_always = false
style_user = "bg:#7aa2f7 fg:#1a1b26 bold"
style_root = "bg:#7aa2f7 fg:#f7768e bold"
format = "[$user]($style)"

[directory]
style = "bg:#3b4261 fg:#c0caf5 bold"
format = "[ 󰝰 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
style = "bg:#7dcfff fg:#1a1b26 bold"
symbol = ""
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#7dcfff fg:#1a1b26 bold"
format = '([\[$all_status$ahead_behind\] ]($style))'
conflicted = "⚔️ $count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?$count "
stashed = "📦 $count "
modified = "!$count "
staged = "+$count "
renamed = "»$count "
deleted = "✘$count "

[nodejs]
style = "bg:#24283b fg:#9ece6a bold"
symbol = ""
format = "[ $symbol ($version) ]($style)"

[rust]
style = "bg:#24283b fg:#ff9e64 bold"
symbol = "󱘗"
format = "[ $symbol ($version) ]($style)"

[golang]
style = "bg:#24283b fg:#7dcfff bold"
symbol = ""
format = "[ $symbol ($version) ]($style)"

[python]
style = "bg:#24283b fg:#e0af68 bold"
symbol = ""
format = "[ $symbol ($version) ]($style)"

[c]
style = "bg:#24283b fg:#7aa2f7 bold"
symbol = ""
format = "[ $symbol ($version) ]($style)"

[cmd_duration]
min_time = 500
show_milliseconds = false
style = "bold #e0af68"
format = " [⏱ $duration]($style)"

[time]
disabled = false
format = ' [\[$time\]]($style)'
style = "bold #565f89"
time_format = "%H:%M"

[character]
success_symbol = "[╰─❯](bold #7dcfff) "
error_symbol   = "[╰─❯](bold #f7768e) "
vimcmd_symbol  = "[╰─❮](bold #bb9af7) "
