# ~/.config/starship.toml
# Minimal Catppuccin Mocha prompt — clean and distraction-free

format = """$directory$git_branch$git_status$cmd_duration
$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
base      = "#1e1e2e"
surface0  = "#313244"
surface1  = "#45475a"
surface2  = "#585b70"
overlay0  = "#6c7086"

[directory]
style = "bold yellow"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
style = "mauve"
format = "[$symbol$branch]($style) "
symbol = " "

[git_status]
style = "peach"
format = '[$all_status$ahead_behind]($style) '

[cmd_duration]
min_time = 2000
style = "overlay0"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold mauve)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

[line_break]
disabled = false
