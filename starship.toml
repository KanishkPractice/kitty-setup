# ~/.config/starship.toml
# Clean Minimal 2-Line High-Contrast Prompt (No emojis)

format = """$directory$git_branch$git_state$git_status$cmd_duration$status$time
$character"""

# ── Directory ────────────────────────────────────────────────
[directory]
style = "bold #70a9ff"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 0
truncate_to_repo = false
read_only = " [RO]"
read_only_style = "bold #ff6b81"

# ── Git Integration ──────────────────────────────────────────
[git_branch]
style = "bold #d77aff"
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "

[git_state]
style = "bold #ff6b81"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = "bold #ffd166"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "~ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = "✓ "
untracked = "?${count} "
stashed = "* "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ── Metrics & Timing ─────────────────────────────────────────
[cmd_duration]
min_time = 500
show_milliseconds = false
style = "bold #ffd166"
format = "[took $duration]($style) "

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold #ff6b81"

[time]
disabled = false
format = '([\[$time\]]($style) )'
style = "bold #9ca3af"
time_format = "%H:%M"

# ── Prompt Character ─────────────────────────────────────────
[character]
success_symbol = "[❯](bold #56cfe1) "
error_symbol   = "[❯](bold #ff6b81) "
vimcmd_symbol  = "[❮](bold #52b788) "

[line_break]
disabled = false
