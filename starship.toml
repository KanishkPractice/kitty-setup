# ~/.config/starship.toml
# Clean, Simple High-Contrast Full Path Prompt

format = """$directory$git_branch$git_status$cmd_duration$status
$character"""

# ── Full Path Directory ──────────────────────────────────────
[directory]
style = "bold #a0dbd3"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 0
truncate_to_repo = false
read_only = " [RO]"
read_only_style = "bold #ff9ba0"

# ── Git Integration ──────────────────────────────────────────
[git_branch]
style = "bold #f3b9d6"
format = "[$symbol$branch]($style) "
symbol = " "

[git_status]
style = "bold #fae2a0"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "~"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = "?"
stashed = "*"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# ── Metrics & Timing ─────────────────────────────────────────
[cmd_duration]
min_time = 1000
show_milliseconds = false
style = "bold #fae2a0"
format = "[took $duration]($style) "

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold #ff9ba0"

# ── Prompt Character ─────────────────────────────────────────
[character]
success_symbol = "[❯](bold #c5e89b) "
error_symbol   = "[❯](bold #ff9ba0) "
vimcmd_symbol  = "[❮](bold #a0dbd3) "

[line_break]
disabled = false

