# ~/.tmux.conf — Tmux fallback for remote/SSH sessions
# Everforest Dark theme (matched to kitty), vim-style navigation

# ── Core Settings ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 20000
set -sg escape-time 0

# ── Prefix ────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Vim-style Pane Navigation ─────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits (same as kitty: enter=horizontal, minus=vertical)
bind Enter split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status Bar (Everforest / Black Transparent) ───────────────
set -g status-position top
set -g status-style "bg=#000000 fg=#f8f4e8"
set -g status-left "#[fg=#000000,bg=#c5e89b,bold] #S #[fg=#c5e89b,bg=#000000] "
set -g status-right "#[fg=#5c6970]│ #[fg=#a0dbd3]%H:%M #[fg=#5c6970]│ #[fg=#c5e89b]%d-%b "
set -g status-left-length 30
setw -g window-status-format "#[fg=#78909c] #I:#W "
setw -g window-status-current-format "#[fg=#000000,bg=#a0dbd3,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#5c6970"
set -g pane-active-border-style "fg=#c5e89b"

# ── Reload Config ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
