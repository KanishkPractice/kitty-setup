# ~/.tmux.conf — Tmux setup styled for Catppuccin Mocha aesthetic

# ── Core Settings ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 20000
set -sg escape-time 0

# ── Prefix ────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Vim-style Pane Navigation ─────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits (same as kitty: enter=horizontal, minus=vertical)
bind Enter split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status Bar (Catppuccin Mocha Floating Pill Style) ─────────
set -g status-position top
set -g status-style "bg=#181825 fg=#cdd6f4"
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#181825] "
set -g status-right "#[fg=#585b70]│ #[fg=#89b4fa]%H:%M #[fg=#585b70]│ #[fg=#a6e3a1]%d-%b "
set -g status-left-length 30
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#11111b,bg=#cba6f7,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# ── Reload Config ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
