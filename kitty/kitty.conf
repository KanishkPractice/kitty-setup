# ~/.config/kitty/kitty.conf
# Catppuccin Mocha Theme — Modular Configuration
# Theme, keybindings, and sessions are split into separate files.

# ── 1. FONTS & TYPOGRAPHY ──────────────────────────────────
font_family      FantasqueSansM Nerd Font Mono
bold_font        FantasqueSansM Nerd Font Mono Bold
italic_font      FantasqueSansM Nerd Font Mono Italic
bold_italic_font FantasqueSansM Nerd Font Mono Bold Italic
font_size        18.0
disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# ── 2. CURSOR & ANIMATIONS ────────────────────────────────
cursor                 #f5e0dc
cursor_text_color      #000000
cursor_shape           beam
cursor_shape_unfocused hollow
# Cursor trail & smooth animations
cursor_trail 1
cursor_trail_decay 0.1 0.45
cursor_trail_start_threshold 1
cursor_blink_interval 0.5
cursor_stop_blinking_after 20.0

# ── 3. WINDOW & LAYOUT ────────────────────────────────────
window_padding_width        16 12
window_margin_width         0
single_window_margin_width  -1
window_border_width         1pt
draw_minimal_borders        yes
hide_window_decorations     no
enabled_layouts              splits,tall,stack,fat,grid,horizontal,vertical
remember_window_size        yes
confirm_os_window_close     2

# ── 4. TRANSPARENCY & EFFECTS ─────────────────────────────
background_opacity          0.75
dynamic_background_opacity  yes
inactive_text_alpha          1.0

# ── 5. TAB BAR (Powerline) ────────────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2
tab_title_max_length  20
tab_title_template    " {index}: {title} "

# ── 6. CLIPBOARD & MOUSE ──────────────────────────────────
copy_on_select        yes
strip_trailing_spaces smart
mouse_hide_wait       3.0
pointer_shape_when_grabbed hand
mouse_map right press ungrabbed paste_from_clipboard
clipboard_control     write-clipboard write-primary no-append

# ── 7. URL HANDLING ────────────────────────────────────────
url_style               curly
detect_urls             yes
open_url_with           default

# ── 8. SCROLLBACK & PAGER ─────────────────────────────────
scrollback_lines        20000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 3.0

# ── 9. BELL & NOTIFICATIONS ───────────────────────────────
enable_audio_bell     no
visual_bell_duration  0.15
visual_bell_color     #313244
window_alert_on_bell  yes
command_on_bell       none
notify_on_cmd_finish  invisible 15.0

# ── 10. PERFORMANCE & INTEGRATION ─────────────────────────
repaint_delay         6
input_delay           1
sync_to_monitor       yes
update_check_interval 0
shell_integration     enabled
shell                 .

# ── 11. REMOTE CONTROL (enables scripting & broadcast) ────
allow_remote_control    socket-only
listen_on               unix:/tmp/kitty-{kitty_pid}

# ── 12. INCLUDES (modular config) ─────────────────────────
include themes/mocha.conf
include keybindings.conf
