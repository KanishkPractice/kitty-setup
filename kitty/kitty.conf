# ~/.config/kitty/kitty.conf
# Modular Aesthetic Terminal Configuration
# Themes, keybindings, and sessions are split into separate files.

# ── 1. FONTS & TYPOGRAPHY ──────────────────────────────────
font_family      FantasqueSansM Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.5
adjust_line_height  115%
adjust_column_width 100%
disable_ligatures   cursor
box_drawing_scale   0.001, 1, 1.5, 2
# Enhanced font contrast rendering for crystal-clear readability
text_composition_strategy 2.0 40
dim_opacity         0.9

# ── Modern Font Alternatives (Uncomment to switch) ──
# font_family      JetBrainsMono Nerd Font Mono
# font_family      GeistMono Nerd Font Mono
# font_family      FiraCode Nerd Font Mono
# font_family      CaskaydiaCove Nerd Font Mono
# font_family      Iosevka Nerd Font Mono

# ── 2. CURSOR & ANIMATIONS ────────────────────────────────
cursor_shape           beam
cursor_beam_thickness  1.8
cursor_shape_unfocused hollow
# Fluid smooth animated cursor trail
cursor_trail 1
cursor_trail_decay 0.1 0.35
cursor_trail_start_threshold 2
cursor_trail_color none
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ── 3. WINDOW & LAYOUT ────────────────────────────────────
window_padding_width        16 22
window_margin_width         0
single_window_margin_width  -1
window_border_width         1.5pt
draw_minimal_borders        no
hide_window_decorations     yes
placement_strategy          center
enabled_layouts              splits,tall,stack,fat,grid,horizontal,vertical
remember_window_size        yes
confirm_os_window_close     0

# ── 4. BACKGROUND & TRANSPARENCY ────────────────────────────
background_opacity          0.85
background_blur             32
dynamic_background_opacity  yes
inactive_text_alpha          1.0

# ── 5. TAB BAR (Floating "Pill" Capsule Style) ───────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
tab_bar_align         center
# Smart Visibility: Set to 1 for always-on dock; set to 2 to auto-hide when only 1 tab
tab_bar_min_tabs      1
tab_bar_margin_width  14.0
tab_bar_margin_height 10.0 4.0
tab_bar_margin_color  none
tab_title_max_length  24
tab_title_template    " {index} {tab.active_wd.split('/')[-1] if tab.active_wd else title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# ── 6. CLIPBOARD & MOUSE ──────────────────────────────────
copy_on_select        yes
strip_trailing_spaces smart
mouse_hide_wait       3.0
pointer_shape_when_grabbed hand
mouse_map right press ungrabbed paste_from_clipboard
clipboard_control     write-clipboard write-primary no-append

# ── 7. URL HANDLING ────────────────────────────────────────
url_style               curly
detect_urls             yes
open_url_with           default

# ── 8. SCROLLBACK & PAGER (Neovim Integration) ─────────────
scrollback_lines        20000
scrollback_pager        nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist ignorecase smartcase' +'$' -
wheel_scroll_multiplier 3.0

# ── 9. BELL & NOTIFICATIONS ───────────────────────────────
enable_audio_bell     no
visual_bell_duration  0.15
visual_bell_color     #f9e2af
window_alert_on_bell  yes
command_on_bell       none
notify_on_cmd_finish  invisible 15.0

# ── 10. PERFORMANCE & INTEGRATION ─────────────────────────
repaint_delay         6
input_delay           1
sync_to_monitor       yes
update_check_interval 0
shell_integration     enabled
shell                 .

# ── 11. REMOTE CONTROL (enables theme hot-swap & broadcast) ──
allow_remote_control    socket-only
listen_on               unix:/tmp/kitty-{kitty_pid}

# ── 12. INCLUDES (modular config) ─────────────────────────
include theme.conf
include keybindings.conf
