# ── Everforest Dark — Black & Transparent High-Visibility Theme ──────
# Pure black background with boosted foreground and vivid ANSI palette
# for maximum readability on a transparent terminal.

foreground              #f8f4e8
background              #000000
selection_foreground    #ffffff
selection_background    #47555e
url_color               #a0e8b8

# Cursor (Bright white-cream for maximum pop on black)
cursor                  #f8f4e8
cursor_text_color       #000000

# Window Borders
active_border_color     #c5e89b
inactive_border_color   #5c6970
bell_border_color       #ff9ba0

# Tab Bar (darkened bar, bright active tab for contrast on black)
active_tab_foreground   #000000
active_tab_background   #c5e89b
inactive_tab_foreground #e8dfd0
inactive_tab_background #1a1a1a
tab_bar_background      #0a0a0a

# ── 16 ANSI Color Palette (Boosted Luminance for Black/Transparent BG) ──────
# Black & Dark Grays (raised so comments are clearly visible on black)
color0                  #78909c
color8                  #a0b4b4

# Red (Bright coral — clear errors & warnings)
color1                  #ff9ba0
color9                  #ffb0b5

# Green (Vivid bamboo — success & git status)
color2                  #c5e89b
color10                 #d5f8ab

# Yellow / Amber (Radiant gold — warnings & highlights)
color3                  #fae2a0
color11                 #fff2b0

# Blue / Teal (Vibrant aqua — directories & keywords)
color4                  #a0dbd3
color12                 #b0ebe3

# Magenta / Purple (Bright lavender — constants & types)
color5                  #f3b9d6
color13                 #ffc9e6

# Cyan / Aqua (Electric mint — symlinks & special tokens)
color6                  #aee8ba
color14                 #bef8ca

# White / Light Grays (Max readability on black)
color7                  #ede1c7
color15                 #ffffff
