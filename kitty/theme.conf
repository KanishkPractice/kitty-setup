# ── Everforest-inspired charcoal theme ──────────────────────────────
# Charcoal background with boosted foreground and vivid ANSI palette
# for clear contrast on a solid background.

foreground              #f8f4e8
background              #181818
selection_foreground    #ffffff
selection_background    #47555e
url_color               #a0e8b8

# Cursor (Bright white-cream for strong contrast)
cursor                  #f8f4e8
cursor_text_color       #000000

# Window Borders (Hyprland Vibrant Purple Outline)
active_border_color     #cba6f7
inactive_border_color   #2a323d
bell_border_color       #ff9ba0

# Tab Bar (Seamless floating bar, purple active tab)
active_tab_foreground   #000000
active_tab_background   #cba6f7
inactive_tab_foreground #e8dfd0
inactive_tab_background #1f232a
tab_bar_background      none

# ── 16 ANSI colors ──────────────────────────────────────────────────
# Dark grays
color0                  #78909c
color8                  #a0b4b4

# Red (Bright coral — clear errors & warnings)
color1                  #ff9ba0
color9                  #ffb0b5

# Green (Vivid bamboo — success & git status)
color2                  #c5e89b
color10                 #d5f8ab

# Yellow / Amber (Radiant gold — warnings & highlights)
color3                  #fae2a0
color11                 #fff2b0

# Blue / Teal (Vibrant aqua — directories & keywords)
color4                  #a0dbd3
color12                 #b0ebe3

# Magenta / Purple (Bright lavender — constants & types)
color5                  #f3b9d6
color13                 #ffc9e6

# Cyan / Aqua (Electric mint — symlinks & special tokens)
color6                  #aee8ba
color14                 #bef8ca

# White / Light Grays (Max readability on black)
color7                  #ede1c7
color15                 #ffffff
