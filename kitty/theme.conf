# ── Catppuccin Mocha Theme ──────────────────────────────────────────
# Modern aesthetic dark theme with vibrant pastel contrast & high text visibility

foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #ffffff
selection_background    #45475a
url_color               #f5e0dc

# Cursor
cursor                  #f5e0dc
cursor_text_color       #11111b

# Window Borders (Active pane outline in Lavender)
active_border_color     #cba6f7
inactive_border_color   #313244
bell_border_color       #f38ba8

# Tab Bar (Floating pill tabs)
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      none

# ── 16 ANSI colors (Optimized for High Text Contrast) ───────────────
# ANSI black matches the terminal background so full-screen TUIs share its opacity.
color0                  #1e1e2e
color8                  #a6adc8

# Red (Vivid Coral)
color1                  #f38ba8
color9                  #f38ba8

# Green (Pastel Bamboo)
color2                  #a6e3a1
color10                 #a6e3a1

# Yellow (Radiant Gold)
color3                  #f9e2af
color11                 #f9e2af

# Blue (Sapphire)
color4                  #89b4fa
color12                 #89b4fa

# Magenta (Lavender Pink)
color5                  #f5c2e7
color13                 #f5c2e7

# Cyan (Electric Mint)
color6                  #94e2d5
color14                 #94e2d5

# White & Light Gray (Pure white color15 for maximum legibility)
color7                  #bac2de
color15                 #ffffff
