# ── Red Forest Torii Aesthetic Theme ──────────────────────────────
# Inspired by mystical Japanese Torii Shrines in misty crimson forests
# Deep obsidian plum background, vibrant Torii vermilion & crimson glow,
# autumn lantern gold, pine jade, and luminous sakura moonlight text.

# Main terminal colors
foreground              #f2edf5
background              #100b14
# High-contrast aesthetic selection (Crisp dark text on glowing Torii Vermilion)
selection_foreground    #100b14
selection_background    #ff4d6d

# Cursor & Glow (Glowing Torii vermilion flame)
cursor                  #ff3355
cursor_text_color       #100b14

# URL underline & styling
url_color               #ff758f

# Window Borders & Bell
active_border_color     #ff3355
inactive_border_color   #2b1b2d
bell_border_color       #ffb703

# Tab Bar (Torii Crimson active glow & dark wine inactive)
active_tab_foreground   #100b14
active_tab_background   #ff3355
inactive_tab_foreground #9e8e9f
inactive_tab_background #1a121e
tab_bar_background      #0c080f

# Search Marks (Fuzzy find / jump highlights)
mark1_foreground #100b14
mark1_background #ff3355
mark2_foreground #100b14
mark2_background #ffb703
mark3_foreground #100b14
mark3_background #74c69d

