# ── KEYBINDINGS ────────────────────────────────────────────────
# All kitty keyboard shortcuts organized by workflow.
# Modifiers: kitty_mod = ctrl+shift

# ── 1. Clipboard & Scrollback ─────────────────────────────────
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard
map kitty_mod+c         copy_to_clipboard
map kitty_mod+v         paste_from_clipboard
map kitty_mod+k         combine : clear_terminal scrollback active : send_text normal,application \x0c
map kitty_mod+f8        show_scrollback

# ── 2. Pane Navigation & Directional Moves (Vim-style) ────────
map kitty_mod+h         neighboring_window left
map kitty_mod+j         neighboring_window down
map kitty_mod+k         neighboring_window up
map kitty_mod+l         neighboring_window right

# ── 3. Directory-Aware Splits (Matches Tmux: Enter = H, - = V) ─
map kitty_mod+enter     launch --location=hsplit --cwd=current
map kitty_mod+minus     launch --location=vsplit --cwd=current
map ctrl+shift+enter    launch --location=hsplit --cwd=current
map ctrl+shift+minus    launch --location=vsplit --cwd=current
map kitty_mod+n         new_os_window_with_cwd

# ── 4. Pane Resizing & Layout Management ──────────────────────
map kitty_mod+r         start_resizing_window
map kitty_mod+left      resize_window narrower 3
map kitty_mod+right     resize_window wider 3
map kitty_mod+up        resize_window taller 3
map kitty_mod+down      resize_window shorter 3
map kitty_mod+z         toggle_layout stack
map kitty_mod+shift+z   next_layout
map f11                 toggle_fullscreen
map kitty_mod+f11       toggle_fullscreen

# ── 5. Tab Management (Directory-Aware & Quick Numbering) ──────
map kitty_mod+t         new_tab_with_cwd
map kitty_mod+w         close_tab
map kitty_mod+q         close_window
map kitty_mod+[         previous_tab
map kitty_mod+]         next_tab

# Alt+Number instant tab switching (1-9)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# ── 6. Font Zoom Controls ─────────────────────────────────────
map kitty_mod+equal        change_font_size all +1.0
map kitty_mod+shift+minus  change_font_size all -1.0
map kitty_mod+0            change_font_size all 0
map ctrl+equal             change_font_size all +1.0
map ctrl+minus             change_font_size all -1.0
map ctrl+0                 change_font_size all 0

# ── 7. Shell Integration & Prompt Navigation ──────────────────
map kitty_mod+g         show_last_command_output
map kitty_mod+shift+g   launch --stdin-source=@last_cmd_output --type=overlay less
map kitty_mod+p>n       scroll_to_prompt 1
map kitty_mod+p>p       scroll_to_prompt -1
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down

# ── 8. Hints, Urls & Pickers ──────────────────────────────────
map kitty_mod+u         kitten hints --type url
map kitty_mod+e         kitten hints --type path --program nvim
map kitty_mod+s         launch --type=overlay ~/.local/bin/scmd
map kitty_mod+p>f       kitten hints --type path
map kitty_mod+p>l       kitten hints --type line
map kitty_mod+p>h       kitten hints --type hash
map kitty_mod+p>i       kitten hints --type regex --regex "[0-9]{1,3}(\\.[0-9]{1,3}){3}"
map kitty_mod+p>y       kitten hints --type word
map kitty_mod+d         launch --type=overlay kitten diff
map kitty_mod+b         launch --allow-remote-control kitten broadcast

# ── 9. Transparency Fine-Tuning (Leader: kitty_mod+a>) ───────
map kitty_mod+a>m       set_background_opacity +0.05
map kitty_mod+a>l       set_background_opacity -0.05
map kitty_mod+a>1       set_background_opacity 1
map kitty_mod+a>d       set_background_opacity default

# ── 11. Workspaces, Sessions & Hot Reload ─────────────────────
map kitty_mod+shift+r   launch --type=os-window kitty --session ~/.config/kitty/sessions/rice.session
map kitty_mod+shift+e   launch --type=os-window kitty --session ~/.config/kitty/sessions/dev.session
map kitty_mod+shift+d   launch --type=os-window kitty --session ~/.config/kitty/sessions/dashboard.session
map kitty_mod+f5        load_config_file
map ctrl+shift+f5       load_config_file
