# ~/.config/kitty/open-actions.conf
# File type handlers for kitty — triggered when clicking file links

# Preview images inline with icat
protocol file
mime image/*
action launch --type=overlay kitten icat --hold ${FILE_PATH}

# Open text files in neovim
protocol file
mime text/*
action launch --type=overlay nvim ${FILE_PATH}

# Open scripts in neovim
protocol file
mime application/x-shellscript
action launch --type=overlay nvim ${FILE_PATH}

# Open JSON/YAML/TOML in neovim
protocol file
mime application/json
action launch --type=overlay nvim ${FILE_PATH}
